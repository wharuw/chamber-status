<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; display: flex;
         align-items: center; justify-content: center; min-height: 100vh; margin: 0;
         background: #f5f6f8; color: #1f2a44; }
  .card { background: #fff; padding: 40px 56px; border-radius: 16px; text-align: center;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .logo { display: block; width: 90px; height: auto; margin: -16px 0 14px -32px; }
  .label { font-size: 18px; color: #667; }
  .num { font-size: 72px; font-weight: 700; margin: 8px 0; color: #1b7f3b; }
  .level-title { font-size: 14px; color: #667; margin-top: 18px; }
  .level { display: inline-block; margin: 6px 0 18px; padding: 8px 24px; border-radius: 999px;
           font-size: 22px; font-weight: 700; color: #1b7f3b; background: #e6f4ea; }
  .time { font-size: 13px; color: #889; line-height: 1.7; }
  .foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid #e3e6ec; }
  .foot-title { font-size: 12px; color: #889; margin-bottom: 6px; }
  .foot table { margin: 0 auto; border-collapse: collapse; font-size: 13px; color: #556; }
  .foot td { padding: 4px 14px; text-align: left; }
  .foot tr.cur td { font-weight: 700; color: #1f2a44; background: #f0f2f6; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .install { display: none; margin-top: 18px; font-size: 12px; color: #667; line-height: 1.6; }
  .install button { font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: #1a5fb4;
                    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  .warn { display: none; margin-top: 14px; padding: 8px 12px; border-radius: 8px;
          background: #fdecea; color: #b3261e; font-size: 13px; }
</style>

<script>

  (function () {
    var box = document.getElementById("install");
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (standalone) return;
    var ua = navigator.userAgent;
    var inApp = /KAKAOTALK|NAVER|Line[/]|FBAN|FBAV|Instagram/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    function show(html) { box.innerHTML = html; box.style.display = "block"; }
    if (inApp) {
      show("📱 홈 화면에 추가하려면 오른쪽 위(또는 아래) 메뉴에서<br><b>‘다른 브라우저로 열기’</b> 후 다시 시도해 주세요.");

    }
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      show('<button id="installBtn">📱 홈 화면에 추가</button>');
      document.getElementById("installBtn").onclick = function () { e.prompt(); };
    });
  })();

</script>
