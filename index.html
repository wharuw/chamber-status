<title>챔버 접수 현황</title>

  .num { font-size: 72px; font-weight: 700; margin: 8px 0; }
  .time { font-size: 13px; color: #889; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">챔버 접수 현황 · 예정</div>

  </div>
